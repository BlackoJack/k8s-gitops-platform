apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: policy-reporter
  namespace: kyverno
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: policy-reporter
      version: "3.10.0"
      sourceRef:
        kind: HelmRepository
        name: policy-reporter
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    replicaCount: 1
    nodeSelector: &ns-infra
      environment: infra
    tolerations: &tol-infra
      - key: environment
        operator: Equal
        value: infra
        effect: PreferNoSchedule
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    rest:
      enabled: true
    metrics:
      enabled: true
      mode: detailed
    ui:
      enabled: true
      name: workload
      replicaCount: 1
      nodeSelector: *ns-infra
      tolerations: *tol-infra
      resources:
        requests:
          cpu: 20m
          memory: 64Mi
        limits:
          memory: 256Mi
      clusters:
        - name: workload
          host: http://policy-reporter:8080
          plugins:
            - name: kyverno
              host: http://policy-reporter-kyverno-plugin:8080
      ingress:
        enabled: true
        className: cilium
        labels:
          external-dns.corp.example/enabled: "true"
        annotations:
          kubernetes.io/ingress.class: cilium
        hosts:
          - host: kyverno.msk.corp.example
            paths:
              - path: /
                pathType: Prefix
        tls:
          - hosts:
              - kyverno.msk.corp.example
    plugin:
      kyverno:
        enabled: true
        replicaCount: 1
        nodeSelector: *ns-infra
        tolerations: *tol-infra
        resources:
          requests:
            cpu: 20m
            memory: 64Mi
          limits:
            memory: 128Mi
    monitoring:
      enabled: true
      serviceMonitor:
        enabled: false
      grafana:
        namespace: monitoring
        dashboards:
          enabled: true
          label: grafana_dashboard
          value: "1"
          multicluster:
            enabled: true
            label: cluster
        folder:
          annotation: grafana_folder
          name: Kyverno
        datasource:
          label: Prometheus
          pluginId: prometheus
          pluginName: Prometheus
