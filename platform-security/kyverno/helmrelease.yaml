apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno
  namespace: kyverno
spec:
  interval: 30m
  timeout: 20m
  chart:
    spec:
      chart: kyverno
      version: "3.9.0"
      sourceRef:
        kind: HelmRepository
        name: kyverno
        namespace: flux-system
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      priorityClassName: platform-critical
      nodeSelector:
        environment: infra
      tolerations:
        - key: environment
          operator: Equal
          value: infra
          effect: PreferNoSchedule
    admissionController:
      replicas: 2
    backgroundController:
      replicas: 1
    cleanupController:
      replicas: 1
    reportsController:
      replicas: 1
    features:
      policyExceptions:
        enabled: true
        namespace: kyverno
    config:
      resourceFiltersIncludeNamespaces:
        - flux-system
        - cattle-system
        - cattle-fleet-system
        - cattle-impersonation-system
        - cattle-monitoring-system
      webhooks:
        namespaceSelector:
          matchExpressions:
            - key: kubernetes.io/metadata.name
              operator: NotIn
              values:
                - kyverno
                - kube-system
                - flux-system
                - cattle-system
                - cattle-fleet-system
                - cattle-impersonation-system
                - cattle-monitoring-system
