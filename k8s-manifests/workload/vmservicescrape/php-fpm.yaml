# Opt-in by Service labels, any namespace. The chart publishes the Service.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: php-fpm
  namespace: monitoring
spec:
  namespaceSelector:
    any: true
  selector:
    matchLabels:
      app.kubernetes.io/component: php-fpm
      monitoring.corp.example/scrape: "true"
  targetLabels:
    - app.kubernetes.io/name
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      relabelConfigs:
        - targetLabel: job
          replacement: php-fpm
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
