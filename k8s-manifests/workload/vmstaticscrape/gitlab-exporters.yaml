# Omnibus exporters on gitlab.corp.example (10.16.1.10).
# Prometheus 200: 443/-/metrics, 9168, 9121, 9187, 9100, 8082, 9229, 5001, 9236, 8151, 9999/metrics (VTS).
# :9999/nginx_status remains stub_status and is not scraped.
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: gitlab-exporter
  namespace: monitoring
spec:
  jobName: gitlab-exporter
  targetEndpoints:
    - targets:
        - gitlab.corp.example:9168
      scheme: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 20s
      metricRelabelConfigs:
        - sourceLabels: [__name__]
          regex: gitlab_pg_sequences_.+
          action: drop
      relabelConfigs:
        - targetLabel: job
          replacement: gitlab-exporter
        - targetLabel: instance
          replacement: gitlab.corp.example
---
