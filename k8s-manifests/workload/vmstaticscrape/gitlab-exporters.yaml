apiVersion: operator.victoriametrics.com/v1beta1
kind: VMStaticScrape
metadata:
  name: gitlab-postgres
  namespace: monitoring
spec:
  jobName: gitlab-postgres
  targetEndpoints:
    - targets:
        - gitlab.corp.example:9187
      scheme: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 25s
      # ~2.9MB raw: per-table statio + relation size. Keep settings/activity/locks.
      metricRelabelConfigs:
        - sourceLabels: [__name__]
          regex: pg_statio_user_tables_.+|pg_total_relation_size_bytes
          action: drop
      relabelConfigs:
        - targetLabel: job
          replacement: gitlab-postgres
        - targetLabel: instance
          replacement: gitlab.corp.example
