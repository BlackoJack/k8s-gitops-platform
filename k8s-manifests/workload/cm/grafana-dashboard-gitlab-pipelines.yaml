apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gitlab-pipelines
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: GitLab
data:
  gitlab-pipelines.json: |
    {
      "uid": "gitlab-pipelines",
      "title": "GitLab pipelines",
      "description": "Пайплайны и jobs gitlab.corp.example через REST/GraphQL. У platform/gitops своего CI нет. Для примера откройте platform/images, platform/config или apps/backend. Раннеры — на дашборде GitLab.",
      "tags": [
        "platform",
        "gitlab",
        "ci",
        "pipeline"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external",
          "targetBlank": true,
          "title": "GitLab",
          "type": "link",
          "url": "https://gitlab.corp.example/${project}"
        },
        {
          "asDropdown": false,
          "icon": "dashboard",
          "targetBlank": false,
          "title": "GitLab infra",
          "type": "link",
          "url": "/d/gitlab"
        },
        {
          "asDropdown": false,
          "icon": "external",
          "targetBlank": true,
          "title": "Alertmanager",
          "type": "link",
          "url": "https://alertmanager.msk.corp.example"
        }
      ],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "gitlab",
            "label": "GitLab API",
            "type": "datasource",
            "query": "yesoreyeram-infinity-datasource",
            "current": {
              "text": "GitLab",
              "value": "gitlab-api"
            },
            "hide": 0
          },
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics Prometheus",
              "value": "VictoriaMetricsProm"
            },
            "hide": 2
          },
          {
            "name": "project",
            "label": "Project",
            "type": "query",
            "datasource": {
              "type": "yesoreyeram-infinity-datasource",
              "uid": "${gitlab}"
            },
            "refresh": 1,
            "includeAll": false,
            "multi": false,
            "sort": 1,
            "current": {
              "text": "platform/images",
              "value": "platform/images"
            },
            "query": {
              "refId": "variable",
              "type": "json",
              "source": "url",
              "format": "table",
              "parser": "backend",
              "url": "https://gitlab.corp.example/api/v4/projects",
              "url_options": {
                "method": "GET",
                "data": "",
                "headers": [],
                "params": [
                  {
                    "key": "membership",
                    "value": "true"
                  },
                  {
                    "key": "simple",
                    "value": "true"
                  },
                  {
                    "key": "archived",
                    "value": "false"
                  },
                  {
                    "key": "order_by",
                    "value": "last_activity_at"
                  },
                  {
                    "key": "sort",
                    "value": "desc"
                  },
                  {
                    "key": "per_page",
                    "value": "100"
                  }
                ]
              },
              "root_selector": "",
              "columns": [
                {
                  "selector": "path_with_namespace",
                  "text": "path_with_namespace",
                  "type": "string"
                }
              ],
              "filters": []
            }
          },
          {
            "name": "status",
            "label": "Status",
            "type": "custom",
            "query": ".* : All, failed : failed, success : success, running : running, pending : pending, canceled : canceled, skipped : skipped, manual : manual",
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "All",
              "value": ".*"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 16,
          "type": "row",
          "title": "По проектам",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 17,
          "type": "table",
          "title": "Последний пайплайн по проектам",
          "description": "GraphQL: 50 проектов с membership. Пустые (без CI, как k8s-mgmt) скрыты. Клик — GitLab. Не зависит от Project.",
          "gridPos": {
            "h": 12,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "yesoreyeram-infinity-datasource",
            "uid": "${gitlab}"
          },
          "targets": [
            {
              "refId": "A",
              "type": "graphql",
              "source": "url",
              "format": "table",
              "parser": "jq-backend",
              "url": "https://gitlab.corp.example/api/graphql",
              "url_options": {
                "method": "POST",
                "data": "",
                "headers": [],
                "params": [],
                "body_type": "graphql",
                "body_graphql_query": "query { projects(membership: true, first: 50, sort: \"latest_activity_desc\") { nodes { fullPath webUrl pipelines(first: 1) { nodes { iid status duration ref source createdAt user { username } } } } } }"
              },
              "root_selector": ".data.projects.nodes | map(select(.pipelines.nodes | length > 0) | {\n  project: .fullPath,\n  webUrl: .webUrl,\n  status: ((.pipelines.nodes[0].status // \"\") | ascii_downcase),\n  iid: .pipelines.nodes[0].iid,\n  duration: .pipelines.nodes[0].duration,\n  ref: .pipelines.nodes[0].ref,\n  source: ((.pipelines.nodes[0].source // \"\") | ascii_downcase),\n  createdAt: .pipelines.nodes[0].createdAt,\n  pipelineUrl: (.webUrl + \"/-/pipelines/\" + (.pipelines.nodes[0].iid | tostring)),\n  user: (.pipelines.nodes[0].user.username // \"\")\n})",
              "columns": [
                {
                  "selector": "project",
                  "text": "project",
                  "type": "string"
                },
                {
                  "selector": "status",
                  "text": "status",
                  "type": "string"
                },
                {
                  "selector": "iid",
                  "text": "pipeline",
                  "type": "number"
                },
                {
                  "selector": "ref",
                  "text": "ref",
                  "type": "string"
                },
                {
                  "selector": "source",
                  "text": "source",
                  "type": "string"
                },
                {
                  "selector": "duration",
                  "text": "duration",
                  "type": "number"
                },
                {
                  "selector": "user",
                  "text": "user",
                  "type": "string"
                },
                {
                  "selector": "createdAt",
                  "text": "created",
                  "type": "timestamp"
                },
                {
                  "selector": "pipelineUrl",
                  "text": "pipelineUrl",
                  "type": "string"
                },
                {
                  "selector": "webUrl",
                  "text": "webUrl",
                  "type": "string"
                }
              ],
              "filters": []
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": true,
              "countRows": true,
              "reducer": [
                "count"
              ]
            },
            "sortBy": [
              {
                "displayName": "created",
                "desc": true
              }
            ]
          },
          "transformations": [
            {
              "id": "filterByValue",
              "options": {
                "filters": [
                  {
                    "fieldName": "status",
                    "config": {
                      "id": "regex",
                      "options": {
                        "value": "^${status}$"
                      }
                    }
                  }
                ],
                "type": "include",
                "match": "all"
              }
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true,
                "align": "left"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "status"
                },
                "properties": [
                  {
                    "id": "custom.width",
                    "value": 120
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background",
                      "mode": "solid"
                    }
                  },
                  {
                    "id": "custom.filterable",
                    "value": true
                  },
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "created": {
                            "text": "created",
                            "color": "yellow"
                          },
                          "waiting_for_resource": {
                            "text": "waiting",
                            "color": "orange"
                          },
                          "preparing": {
                            "text": "preparing",
                            "color": "blue"
                          },
                          "pending": {
                            "text": "pending",
                            "color": "yellow"
                          },
                          "running": {
                            "text": "running",
                            "color": "blue"
                          },
                          "success": {
                            "text": "success",
                            "color": "green"
                          },
                          "failed": {
                            "text": "failed",
                            "color": "red"
                          },
                          "canceling": {
                            "text": "canceling",
                            "color": "purple"
                          },
                          "canceled": {
                            "text": "canceled",
                            "color": "purple"
                          },
                          "skipped": {
                            "text": "skipped",
                            "color": "text"
                          },
                          "manual": {
                            "text": "manual",
                            "color": "orange"
                          },
                          "scheduled": {
                            "text": "scheduled",
                            "color": "blue"
                          },
                          "waiting_for_callback": {
                            "text": "callback",
                            "color": "orange"
                          }
                        }
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "project"
                },
                "properties": [
                  {
                    "id": "links",
                    "value": [
                      {
                        "title": "Project",
                        "url": "${__data.fields.webUrl}",
                        "targetBlank": true
                      }
                    ]
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "pipeline"
                },
                "properties": [
                  {
                    "id": "links",
