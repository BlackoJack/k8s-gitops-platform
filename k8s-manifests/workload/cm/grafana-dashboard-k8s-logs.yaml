apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-k8s-logs
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Logs
data:
  k8s-logs.json: |
    {
      "uid": "k8s-logs",
      "title": "Логи",
      "description": "Логи кластера из VictoriaLogs и потребление CPU, памяти, сети, диска и рестарты из VictoriaMetrics по тем же фильтрам.",
      "tags": [
        "platform",
        "logs",
        "kubernetes",
        "victorialogs"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "editable": true,
      "graphTooltip": 1,
      "fiscalYearStartMonth": 0,
      "links": [
        {
          "asDropdown": false,
          "icon": "bolt",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": false,
          "title": "Алерты",
          "type": "link",
          "url": "/d/alerts"
        },
        {
          "asDropdown": true,
          "icon": "dashboard",
          "keepTime": true,
          "includeVars": false,
          "tags": [
            "platform"
          ],
          "targetBlank": false,
          "title": "Дашборды",
          "type": "dashboards"
        },
        {
          "asDropdown": false,
          "icon": "external",
          "includeVars": false,
          "keepTime": true,
          "targetBlank": true,
          "title": "VictoriaLogs UI",
          "tooltip": "Live tail и фасеты полей",
          "type": "link",
          "url": "https://logs.msk.corp.example/select/vmui/"
        }
      ],
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m"
        ]
      },
      "templating": {
        "list": [
          {
            "name": "cluster",
            "label": "кластер",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "VictoriaLogs"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all",
              "selected": true
            },
            "query": {
              "refId": "VictoriaLogsVariableQueryEditor-VariableQuery",
              "type": "fieldValue",
              "field": "cluster",
              "query": "*",
              "limit": 50
            },
            "definition": "cluster"
          },
          {
            "name": "namespace",
            "label": "namespace",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "VictoriaLogs"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all",
              "selected": true
            },
            "query": {
              "refId": "VictoriaLogsVariableQueryEditor-VariableQuery",
              "type": "fieldValue",
              "field": "kubernetes.pod_namespace",
              "query": "cluster:$cluster",
              "limit": 500
            },
            "definition": "kubernetes.pod_namespace"
          },
          {
            "name": "pod",
            "label": "pod",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "VictoriaLogs"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all",
              "selected": true
            },
            "query": {
              "refId": "VictoriaLogsVariableQueryEditor-VariableQuery",
              "type": "fieldValue",
              "field": "kubernetes.pod_name",
              "query": "cluster:$cluster kubernetes.pod_namespace:$namespace",
              "limit": 1000
            },
            "definition": "kubernetes.pod_name"
          },
          {
            "name": "container",
            "label": "container",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "VictoriaLogs"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all",
              "selected": true
            },
            "query": {
              "refId": "VictoriaLogsVariableQueryEditor-VariableQuery",
              "type": "fieldValue",
              "field": "kubernetes.container_name",
              "query": "cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod",
              "limit": 200
            },
            "definition": "kubernetes.container_name"
          },
          {
            "name": "groupby",
            "label": "группировка",
            "type": "custom",
            "query": "namespace : kubernetes.pod_namespace, pod : kubernetes.pod_name, container : kubernetes.container_name, cluster : cluster, node : kubernetes.pod_node_name, level : level",
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "namespace",
              "value": "kubernetes.pod_namespace",
              "selected": true
            },
            "options": [
              {
                "text": "namespace",
                "value": "kubernetes.pod_namespace",
                "selected": true
              },
              {
                "text": "pod",
                "value": "kubernetes.pod_name",
                "selected": false
              },
              {
                "text": "container",
                "value": "kubernetes.container_name",
                "selected": false
              },
              {
                "text": "cluster",
                "value": "cluster",
                "selected": false
              },
              {
                "text": "node",
                "value": "kubernetes.pod_node_name",
                "selected": false
              },
              {
                "text": "level",
                "value": "level",
                "selected": false
              }
            ],
            "description": "Режет графики, top и саму ленту: по одному панели на значение. Список панелей — фильтр «группы в ленте»."
          },
          {
            "name": "group",
            "label": "группы в ленте",
            "type": "query",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "VictoriaLogs"
            },
            "refresh": 2,
            "sort": 1,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "current": {
              "text": "All",
              "value": "$__all",
              "selected": true
            },
            "query": {
              "refId": "VictoriaLogsVariableQueryEditor-VariableQuery",
              "type": "fieldValue",
              "field": "$groupby",
              "query": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search",
              "limit": 8
            },
            "definition": "$groupby",
            "description": "Отдельная лента на каждое выбранное значение. All — до 8 значений (алфавит, не top). Для pod сначала сузьте namespace."
          },
          {
            "name": "focus",
            "label": "фокус",
            "type": "custom",
            "query": "все : *, только ошибки : error",
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "все",
              "value": "*",
              "selected": true
            },
            "options": [
              {
                "text": "все",
                "value": "*",
                "selected": true
              },
              {
                "text": "только ошибки",
                "value": "error",
                "selected": false
              }
            ],
            "description": "«только ошибки» оставляет строки со словом error. Уже сужает и графики, и ленту."
          },
          {
            "name": "maxlines",
            "label": "строк в ленте",
            "type": "custom",
            "query": "500,1000,2000,5000",
            "includeAll": false,
            "multi": false,
            "current": {
              "text": "500",
              "value": "500",
              "selected": true
            },
            "options": [
              {
                "text": "500",
                "value": "500",
                "selected": true
              },
              {
                "text": "1000",
                "value": "1000",
                "selected": false
              },
              {
                "text": "2000",
                "value": "2000",
                "selected": false
              },
              {
                "text": "5000",
                "value": "5000",
                "selected": false
              }
            ]
          },
          {
            "name": "search",
            "label": "поиск",
            "type": "textbox",
            "hide": 0,
            "current": {
              "text": "*",
              "value": "*"
            },
            "query": "*",
            "description": "* — всё. Слово в сообщении или фрагмент LogsQL, например status:>=500."
          },
          {
            "name": "Filters",
            "label": "ещё фильтры",
            "type": "adhoc",
            "datasource": {
              "type": "victoriametrics-logs-datasource",
              "uid": "VictoriaLogs"
            }
          }
        ]
      },
      "annotations": {
        "list": []
      },
      "panels": [
        {
          "id": 1,
          "type": "text",
          "title": "",
          "gridPos": {
            "h": 3,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "transparent": true,
          "options": {
            "mode": "markdown",
            "content": "**Группировка** режет графики и ленту: ниже будет отдельная панель на каждое значение (фильтр «группы в ленте», максимум 8). **Фокус** и namespace/pod режут всю выборку.\n\n**Ресурсы** — те же cluster, namespace, pod и container, но из VictoriaMetrics. Сеть считается на под: фильтр container на неё не действует. На графиках топ серий, чтобы «All» не раздувал легенду.\n\nВ каждой ленте справа — поля, табличный вид и **скачивание txt / json / csv**."
          }
        },
        {
          "id": 20,
          "type": "row",
          "title": "Сводка",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 3
          },
          "panels": []
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Строк",
          "description": "Сколько лог-строк попало в фильтры за интервал.",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 0,
            "y": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats count() logs",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "blue",
                    "value": null
                  }
                ]
              }
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Ошибки",
          "description": "error/fatal/critical в тексте или level, либо HTTP status ≥ 400 — независимо от фокуса.",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 5,
            "y": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "(error OR level:in(\"error\",\"err\",\"fatal\",\"critical\",\"Error\") OR status:>=400) cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats count() logs",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "area",
            "justifyMode": "center",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Namespaces",
          "description": "Сколько разных namespace в текущей выборке.",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 10,
            "y": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats count_uniq(kubernetes.pod_namespace) namespaces",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "purple",
                    "value": null
                  }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Pods",
          "description": "Сколько разных подов в текущей выборке.",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 15,
            "y": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats count_uniq(kubernetes.pod_name) pods",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  }
                ]
              }
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Групп",
          "description": "Уникальных значений у поля группировки. Для pod лучше сначала сузить namespace.",
          "gridPos": {
            "h": 4,
            "w": 5,
            "x": 19,
            "y": 4
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats count_uniq($groupby) groups",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "wideLayout": true,
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "decimals": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  }
                ]
              }
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Поток · ${groupby:text}",
          "description": "Слои — выбранная группировка. Для pod/container сначала сузьте namespace, иначе серий будет слишком много.",
          "gridPos": {
            "h": 10,
            "w": 16,
            "x": 0,
            "y": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats by ($groupby) count() logs",
              "queryType": "statsRange",
              "refId": "A",
              "legendFormat": "{{$groupby}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "sum"
              ],
              "sortBy": "Sum",
              "sortDesc": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "custom": {
                "drawStyle": "bars",
                "fillOpacity": 85,
                "lineWidth": 0,
                "showPoints": "never",
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                },
                "barAlignment": 0,
                "gradientMode": "hue",
                "axisBorderShow": false,
                "scaleDistribution": {
                  "type": "linear"
                }
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 8,
          "type": "piechart",
          "title": "Доля · ${groupby:text}",
          "description": "Топ-12 значений группировки за весь интервал.",
          "gridPos": {
            "h": 10,
            "w": 8,
            "x": 16,
            "y": 8
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats by ($groupby) count() logs | sort by (logs desc) | limit 12",
              "queryType": "stats",
              "refId": "A",
              "legendFormat": "{{$groupby}}"
            }
          ],
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "pieType": "donut",
            "displayLabels": [
              "percent"
            ],
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "values": [
                "value",
                "percent"
              ],
              "calcs": []
            },
            "tooltip": {
              "mode": "single",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "unit": "short"
            }
          }
        },
        {
          "id": 9,
          "type": "table",
          "title": "Top · ${groupby:text}",
          "description": "Самые болтливые значения. Меню панели (⋯) → Inspect → Data → Download CSV.",
          "gridPos": {
            "h": 9,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "editorMode": "code",
              "expr": "$focus cluster:$cluster kubernetes.pod_namespace:$namespace kubernetes.pod_name:$pod kubernetes.container_name:$container $search | stats by ($groupby) count() logs | sort by (logs desc) | limit 20",
              "queryType": "stats",
              "refId": "A"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "footer": {
              "show": true,
              "countRows": false,
              "reducer": [
                "sum"
              ],
              "fields": ""
            }
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true,
                "align": "auto",
                "inspect": true
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byRegexp",
                  "options": "/^(logs|строк|Value)$/"
                },
                "properties": [
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "gauge",
                      "mode": "gradient",
                      "valueDisplayMode": "color"
                    }
                  },
                  {
                    "id": "min",
                    "value": 0
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "continuous-BlPu"
                    }
                  },
                  {
                    "id": "displayName",
                    "value": "строк"
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
