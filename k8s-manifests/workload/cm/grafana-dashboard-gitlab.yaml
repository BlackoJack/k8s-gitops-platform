apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-gitlab
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: GitLab
data:
  gitlab.json: |
    {
      "uid": "gitlab",
      "title": "GitLab",
      "description": "gitlab.corp.example: Rails, Sidekiq, Workhorse, Gitaly, Registry, KAS, host exporters, k8s runners, agentk.",
      "tags": [
        "platform",
        "gitlab",
        "ci",
        "runner",
        "agent"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external",
          "targetBlank": true,
          "title": "GitLab",
          "type": "link",
          "url": "https://gitlab.corp.example"
        },
        {
          "asDropdown": false,
          "icon": "dashboard",
          "targetBlank": false,
          "title": "Pipelines",
          "type": "link",
          "url": "/d/gitlab-pipelines"
        },
        {
          "asDropdown": false,
          "icon": "external",
          "targetBlank": true,
          "title": "Alertmanager",
          "type": "link",
          "url": "https://alertmanager.msk.corp.example"
        }
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics Prometheus",
              "value": "VictoriaMetricsProm"
            },
            "hide": 0
          },
          {
            "name": "cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(kube_pod_info{namespace=~\"gitlab-ci|gitlab-agent\"}, cluster)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "runner",
            "label": "Runner",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(up{job=\"gitlab-runner\", cluster=~\"$cluster\"}, runner_release)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "GitLab HTTP",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(last_over_time(probe_success{job=\"uptime-http\", instance=~\".*gitlab.corp.example.*\"}[15m]))",
              "legendFormat": "http"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "textMode": "auto",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Runners up",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(up{job=\"gitlab-runner\", cluster=~\"$cluster\", runner_release=~\"$runner\"} == 1) or vector(0)",
              "legendFormat": "runners"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Agent Ready",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(kube_pod_status_ready{cluster=~\"$cluster\", namespace=\"gitlab-agent\", condition=\"true\"}) or vector(0)",
              "legendFormat": "ready"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "green",
                    "value": 2
                  }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Jobs running",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(gitlab_runner_jobs{cluster=~\"$cluster\", runner_release=~\"$runner\", state!=\"idle\"}) or vector(0)",
              "legendFormat": "jobs"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Failed / 1h",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(gitlab_runner_failed_jobs_total{cluster=~\"$cluster\", runner_release=~\"$runner\"}[1h])) or vector(0)",
              "legendFormat": "failed"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 3
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "CI pods Pending",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(kube_pod_status_phase{cluster=~\"$cluster\", namespace=\"gitlab-ci\", phase=\"Pending\"} == 1) or vector(0)",
              "legendFormat": "pending"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          }
        },
        {
          "id": 28,
          "type": "row",
          "title": "GitLab instance",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 5
          }
        },
        {
          "id": 29,
          "type": "stat",
          "title": "CI queue",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(gitlab_ci_current_queue_size{job=\"gitlab\"}) or vector(0)",
              "legendFormat": "queue"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 5
                  },
                  {
                    "color": "red",
                    "value": 15
                  }
                ]
              }
            }
          }
        },
        {
          "id": 30,
          "type": "stat",
          "title": "Job register / 1h",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(increase(job_register_attempts_total{job=\"gitlab\"}[1h])) or vector(0)",
              "legendFormat": "register"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0
            }
          }
        },
        {
          "id": 31,
          "type": "stat",
          "title": "Sidekiq queued",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(sidekiq_jobs_enqueued_size{job=\"gitlab-exporter\"}) or vector(0)",
              "legendFormat": "queued"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 10
                  },
                  {
                    "color": "red",
                    "value": 50
                  }
                ]
              }
            }
          }
        },
        {
          "id": 32,
          "type": "stat",
          "title": "HTTP 5xx %",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "100 * (sum(rate(http_requests_total{job=\"gitlab\", status=~\"5..\"}[5m])) or vector(0)) / clamp_min(sum(rate(http_requests_total{job=\"gitlab\"}[5m])), 0.001)",
              "legendFormat": "HTTP 5xx %"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 2,
              "unit": "percent",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          }
        },
        {
          "id": 33,
          "type": "stat",
          "title": "Puma queued",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum(puma_queued_connections{job=\"gitlab\"}) or vector(0)",
              "legendFormat": "Puma queued"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 10
                  }
                ]
              }
            }
          }
        },
        {
          "id": 34,
          "type": "stat",
          "title": "/-/metrics",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 6
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(up{job=\"gitlab\"}) or vector(0)",
              "legendFormat": "/-/metrics"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 35,
          "type": "timeseries",
          "title": "CI queue / job register",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "max(gitlab_ci_current_queue_size{job=\"gitlab\"})",
              "legendFormat": "queue size"
            },
            {
              "refId": "B",
              "expr": "sum(rate(job_register_attempts_total{job=\"gitlab\"}[5m]))",
              "legendFormat": "register"
            },
            {
              "refId": "C",
              "expr": "sum(rate(job_register_attempts_failed_total{job=\"gitlab\"}[5m]))",
              "legendFormat": "register fail"
            },
            {
              "refId": "D",
              "expr": "sum by (operation) (rate(gitlab_ci_queue_operations_total{job=\"gitlab\"}[5m]))",
              "legendFormat": "{{operation}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 36,
          "type": "timeseries",
          "title": "Sidekiq",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (name) (sidekiq_queue_size{job=\"gitlab-exporter\"})",
              "legendFormat": "queue {{name}}"
            },
            {
              "refId": "B",
              "expr": "sum(rate(sidekiq_jobs_processed_total{job=\"gitlab-exporter\"}[5m]))",
              "legendFormat": "processed / s"
            },
            {
              "refId": "C",
              "expr": "sum(rate(sidekiq_jobs_failed_total{job=\"gitlab-exporter\"}[5m]))",
              "legendFormat": "failed / s"
            },
            {
              "refId": "D",
              "expr": "sum(sidekiq_jobs_dead_size{job=\"gitlab-exporter\"})",
              "legendFormat": "dead"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 37,
          "type": "timeseries",
          "title": "HTTP requests / s",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status, method) (rate(http_requests_total{job=\"gitlab\"}[5m]))",
              "legendFormat": "{{method}} {{status}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 38,
          "type": "timeseries",
          "title": "SQL p90",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 18
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.9, sum by (le) (rate(gitlab_sql_duration_seconds_bucket{job=\"gitlab\"}[5m])))",
              "legendFormat": "p90"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 8,
          "type": "row",
          "title": "Pipelines / jobs",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 26
          }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Jobs running",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (runner_name) (gitlab_runner_jobs{cluster=~\"$cluster\", runner_release=~\"$runner\", state!=\"idle\"})",
              "legendFormat": "{{runner_name}}"
            },
            {
              "refId": "B",
              "expr": "sum by (runner_release) (gitlab_runner_concurrent{cluster=~\"$cluster\", runner_release=~\"$runner\"})",
              "legendFormat": "{{runner_release}} concurrent"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 10,
          "type": "timeseries",
          "title": "Job failures / s",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 27
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (runner_name, failure_reason) (rate(gitlab_runner_failed_jobs_total{cluster=~\"$cluster\", runner_release=~\"$runner\"}[5m]))",
              "legendFormat": "{{runner_name}} {{failure_reason}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Job duration p50 / p90",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 35
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.5, sum by (le, runner_name) (rate(gitlab_runner_job_duration_seconds_bucket{cluster=~\"$cluster\", runner_release=~\"$runner\"}[15m])))",
              "legendFormat": "{{runner_name}} p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.9, sum by (le, runner_name) (rate(gitlab_runner_job_duration_seconds_bucket{cluster=~\"$cluster\", runner_release=~\"$runner\"}[15m])))",
              "legendFormat": "{{runner_name}} p90"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Queue wait p90",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 35
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.9, sum by (le, runner_name) (rate(gitlab_runner_job_queue_duration_seconds_bucket{cluster=~\"$cluster\", runner_release=~\"$runner\"}[15m])))",
              "legendFormat": "{{runner_name}} p90"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "CI pods by phase",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 43
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count by (phase) (kube_pod_status_phase{cluster=~\"$cluster\", namespace=\"gitlab-ci\"} == 1)",
              "legendFormat": "{{phase}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "custom": {
                "fillOpacity": 20,
                "lineWidth": 1,
                "stacking": {
                  "mode": "normal",
                  "group": "A"
                }
              }
            }
          }
        },
        {
          "id": 14,
          "type": "timeseries",
          "title": "Succeeded jobs / s",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 43
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "clamp_min(sum by (runner_release) (rate(gitlab_runner_jobs_total{cluster=~\"$cluster\", runner_release=~\"$runner\"}[5m])) - sum by (runner_release) (rate(gitlab_runner_failed_jobs_total{cluster=~\"$cluster\", runner_release=~\"$runner\"}[5m])), 0)",
              "legendFormat": "{{runner_release}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1
              }
            }
          }
        },
        {
          "id": 15,
