          "options": { "colorMode": "background", "graphMode": "area", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "fieldConfig": { "defaults": { "unit": "s", "decimals": 2, "noValue": "нет данных", "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }, { "color": "orange", "value": 2 }, { "color": "red", "value": 5 }] } } }
        },
        {
          "id": 44,
          "type": "table",
          "title": "Пробы vhost",
          "description": "Строка — балансер и проверяемый адрес. У health.corp.example это /healthz и /readyz, у остальных — /.",
