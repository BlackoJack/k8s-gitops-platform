          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "refId": "A",
            "format": "table",
            "instant": true,
            "expr": "label_join(label_replace(probe_success{job=\"angie-vhost\",balancer=~\"$instance\",vhost=~\"$zone\"}, \"col\", \"Status\", \"vhost\", \".*\"), \"row\", \" / \", \"balancer\", \"endpoint\") or label_join(label_replace(probe_http_status_code{job=\"angie-vhost\",balancer=~\"$instance\",vhost=~\"$zone\"}, \"col\", \"HTTP\", \"vhost\", \".*\"), \"row\", \" / \", \"balancer\", \"endpoint\") or label_join(label_replace(probe_duration_seconds{job=\"angie-vhost\",balancer=~\"$instance\",vhost=~\"$zone\"}, \"col\", \"Latency\", \"vhost\", \".*\"), \"row\", \" / \", \"balancer\", \"endpoint\") or label_join(label_replace((probe_ssl_earliest_cert_expiry{job=\"angie-vhost\",balancer=~\"$instance\",vhost=~\"$zone\"} - time()) / 86400, \"col\", \"TLS days\", \"vhost\", \".*\"), \"row\", \" / \", \"balancer\", \"endpoint\")"
          }],
          "options": { "showHeader": true, "cellHeight": "sm", "sortBy": [{ "displayName": "Status", "desc": false }] },
          "fieldConfig": {
            "defaults": { "custom": { "filterable": true, "align": "center" } },
            "overrides": [
              { "matcher": { "id": "byName", "options": "Vhost" }, "properties": [{ "id": "custom.align", "value": "left" }, { "id": "custom.width", "value": 420 }] },
              { "matcher": { "id": "byName", "options": "Status" }, "properties": [{ "id": "custom.width", "value": 110 }, { "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "mappings", "value": [{ "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }] }] },
              { "matcher": { "id": "byName", "options": "HTTP" }, "properties": [{ "id": "decimals", "value": 0 }, { "id": "custom.width", "value": 100 }, { "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "green", "value": 200 }, { "color": "orange", "value": 400 }, { "color": "red", "value": 500 }] } }] },
              { "matcher": { "id": "byName", "options": "Latency" }, "properties": [{ "id": "unit", "value": "s" }, { "id": "decimals", "value": 3 }, { "id": "custom.width", "value": 120 }] },
              { "matcher": { "id": "byName", "options": "TLS days" }, "properties": [{ "id": "unit", "value": "suffix:d" }, { "id": "decimals", "value": 0 }, { "id": "custom.width", "value": 120 }, { "id": "custom.cellOptions", "value": { "type": "color-background" } }, { "id": "thresholds", "value": { "mode": "absolute", "steps": [{ "color": "red", "value": null }, { "color": "orange", "value": 14 }, { "color": "green", "value": 30 }] } }] }
            ]
          },
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "pattern": "/^(row|col|Value)$/" } } },
            { "id": "groupingToMatrix", "options": { "columnField": "col", "rowField": "row", "valueField": "Value" } },
            { "id": "organize", "options": { "excludeByName": { "Time": true }, "indexByName": { "row": 0, "Status": 1, "HTTP": 2, "Latency": 3, "TLS days": 4 }, "renameByName": { "row": "Vhost" } } }
          ]
        },
        {
          "id": 45,
          "type": "timeseries",
          "title": "Время ответа",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 81 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "refId": "A", "expr": "probe_duration_seconds{job=\"angie-vhost\",balancer=~\"$instance\",vhost=~\"$zone\"}", "legendFormat": "{{balancer}} {{endpoint}}" }],
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["mean", "max"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "s", "custom": { "fillOpacity": 10, "lineWidth": 1, "spanNulls": true, "showPoints": "never" } } }
