apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-vpa
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: VPA
data:
  vpa.json: |
    {
      "uid": "vpa-recommendations",
      "title": "VPA Recommendations",
      "description": "Рекомендации Vertical Pod Autoscaler: target / lower / upper vs текущие requests и usage.",
      "tags": ["platform", "vpa", "autoscaling"],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "editable": true,
      "graphTooltip": 1,
      "time": { "from": "now-6h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": { "text": "VictoriaMetrics Prometheus", "value": "VictoriaMetricsProm" },
            "hide": 0
          },
          {
            "name": "cluster",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(kube_pod_info, cluster)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\"}, namespace)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "vpa",
            "label": "VPA",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\"}, verticalpodautoscaler)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "container",
            "type": "query",
            "datasource": { "type": "prometheus", "uid": "${datasource}" },
            "query": "label_values(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\"}, container)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "VPAs",
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "refId": "A", "expr": "count(count by (namespace, verticalpodautoscaler) (kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\"})) or vector(0)" }],
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "fieldConfig": { "defaults": { "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "orange", "value": null }, { "color": "green", "value": 1 }] } } }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Containers",
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "refId": "A", "expr": "count(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}) or vector(0)" }],
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "fieldConfig": { "defaults": { "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "orange", "value": null }, { "color": "blue", "value": 1 }] } } }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Live mode",
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "refId": "A", "expr": "count(kube_verticalpodautoscaler_spec_updatepolicy_updatemode{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",update_mode=~\"InPlaceOrRecreate|InPlace\"} == 1) or vector(0)" }],
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "fieldConfig": { "defaults": { "decimals": 0, "thresholds": { "mode": "absolute", "steps": [{ "color": "orange", "value": null }, { "color": "green", "value": 1 }] } } }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "CPU request / target (max)",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "refId": "A", "expr": "max((sum by (namespace, container) (kube_pod_container_resource_requests{cluster=~\"$cluster\",namespace=~\"$namespace\",container=~\"$container\",resource=\"cpu\"})) / (sum by (namespace, container) (kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}))) or vector(0)" }],
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 2, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }, { "color": "green", "value": 0.8 }, { "color": "orange", "value": 1.5 }, { "color": "red", "value": 2 }] } } }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Memory request / target (max)",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 1 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{ "refId": "A", "expr": "max((sum by (namespace, container) (kube_pod_container_resource_requests{cluster=~\"$cluster\",namespace=~\"$namespace\",container=~\"$container\",resource=\"memory\"})) / (sum by (namespace, container) (kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}))) or vector(0)" }],
          "options": { "colorMode": "background", "graphMode": "none", "justifyMode": "center", "reduceOptions": { "calcs": ["lastNotNull"], "values": false } },
          "fieldConfig": { "defaults": { "unit": "percentunit", "decimals": 2, "thresholds": { "mode": "absolute", "steps": [{ "color": "blue", "value": null }, { "color": "green", "value": 0.8 }, { "color": "orange", "value": 1.5 }, { "color": "red", "value": 2 }] } } }
        },
        {
          "id": 7,
          "type": "table",
          "title": "Recommendations",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 5 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [{
            "refId": "A",
            "format": "table",
            "instant": true,
            "expr": "label_replace(label_join(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}, \"row\", \"/\", \"namespace\", \"target_kind\", \"target_name\", \"container\"), \"col\", \"CPU target\", \"__name__\", \".*\") or label_replace(label_join(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}, \"row\", \"/\", \"namespace\", \"target_kind\", \"target_name\", \"container\"), \"col\", \"CPU lower\", \"__name__\", \".*\") or label_replace(label_join(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}, \"row\", \"/\", \"namespace\", \"target_kind\", \"target_name\", \"container\"), \"col\", \"CPU upper\", \"__name__\", \".*\") or label_replace(label_join(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}, \"row\", \"/\", \"namespace\", \"target_kind\", \"target_name\", \"container\"), \"col\", \"Mem target\", \"__name__\", \".*\") or label_replace(label_join(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_memory{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}, \"row\", \"/\", \"namespace\", \"target_kind\", \"target_name\", \"container\"), \"col\", \"Mem lower\", \"__name__\", \".*\") or label_replace(label_join(kube_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_memory{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}, \"row\", \"/\", \"namespace\", \"target_kind\", \"target_name\", \"container\"), \"col\", \"Mem upper\", \"__name__\", \".*\")"
          }],
          "options": { "showHeader": true, "cellHeight": "sm", "sortBy": [{ "displayName": "Workload", "desc": false }] },
          "fieldConfig": {
            "defaults": { "custom": { "filterable": true, "align": "center" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Workload" },
                "properties": [{ "id": "custom.align", "value": "left" }, { "id": "custom.width", "value": 420 }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "/^CPU /" },
                "properties": [{ "id": "unit", "value": "cores" }, { "id": "decimals", "value": 3 }]
              },
              {
                "matcher": { "id": "byRegexp", "options": "/^Mem /" },
                "properties": [{ "id": "unit", "value": "bytes" }, { "id": "decimals", "value": 1 }]
              }
            ]
          },
          "transformations": [
            { "id": "filterFieldsByName", "options": { "include": { "pattern": "/^(row|col|Value)$/" } } },
            { "id": "groupingToMatrix", "options": { "columnField": "col", "rowField": "row", "valueField": "Value" } },
            {
              "id": "organize",
              "options": {
                "excludeByName": { "Time": true },
                "indexByName": { "row": 0, "CPU target": 1, "CPU lower": 2, "CPU upper": 3, "Mem target": 4, "Mem lower": 5, "Mem upper": 6 },
                "renameByName": { "row": "Workload" }
              }
            }
          ]
        },
        {
          "id": 8,
          "type": "row",
          "title": "CPU",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 15 }
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "CPU: usage / request / VPA",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "refId": "A", "expr": "sum by (namespace, container) (rate(container_cpu_usage_seconds_total{cluster=~\"$cluster\",namespace=~\"$namespace\",container=~\"$container\",container!=\"\",container!=\"POD\"}[$__rate_interval]))", "legendFormat": "usage {{namespace}}/{{container}}" },
            { "refId": "B", "expr": "sum by (namespace, container) (kube_pod_container_resource_requests{cluster=~\"$cluster\",namespace=~\"$namespace\",container=~\"$container\",resource=\"cpu\"})", "legendFormat": "request {{namespace}}/{{container}}" },
            { "refId": "C", "expr": "kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}", "legendFormat": "target {{namespace}}/{{verticalpodautoscaler}}/{{container}}" },
            { "refId": "D", "expr": "kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}", "legendFormat": "lower {{namespace}}/{{verticalpodautoscaler}}/{{container}}" },
            { "refId": "E", "expr": "kube_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_cpu{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}", "legendFormat": "upper {{namespace}}/{{verticalpodautoscaler}}/{{container}}" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "cores", "custom": { "fillOpacity": 0, "lineWidth": 2, "spanNulls": true } } }
        },
        {
          "id": 10,
          "type": "row",
          "title": "Memory",
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 26 }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "Memory: usage / request / VPA",
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 27 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "targets": [
            { "refId": "A", "expr": "sum by (namespace, container) (container_memory_working_set_bytes{cluster=~\"$cluster\",namespace=~\"$namespace\",container=~\"$container\",container!=\"\",container!=\"POD\"})", "legendFormat": "usage {{namespace}}/{{container}}" },
            { "refId": "B", "expr": "sum by (namespace, container) (kube_pod_container_resource_requests{cluster=~\"$cluster\",namespace=~\"$namespace\",container=~\"$container\",resource=\"memory\"})", "legendFormat": "request {{namespace}}/{{container}}" },
            { "refId": "C", "expr": "kube_verticalpodautoscaler_status_recommendation_containerrecommendations_target_memory{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}", "legendFormat": "target {{namespace}}/{{verticalpodautoscaler}}/{{container}}" },
            { "refId": "D", "expr": "kube_verticalpodautoscaler_status_recommendation_containerrecommendations_lowerbound_memory{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}", "legendFormat": "lower {{namespace}}/{{verticalpodautoscaler}}/{{container}}" },
            { "refId": "E", "expr": "kube_verticalpodautoscaler_status_recommendation_containerrecommendations_upperbound_memory{cluster=~\"$cluster\",namespace=~\"$namespace\",verticalpodautoscaler=~\"$vpa\",container=~\"$container\"}", "legendFormat": "upper {{namespace}}/{{verticalpodautoscaler}}/{{container}}" }
          ],
          "options": { "legend": { "displayMode": "table", "placement": "right", "showLegend": true, "calcs": ["lastNotNull"] }, "tooltip": { "mode": "multi", "sort": "desc" } },
          "fieldConfig": { "defaults": { "unit": "bytes", "custom": { "fillOpacity": 0, "lineWidth": 2, "spanNulls": true } } }
        }
      ]
    }
