apiVersion: v1
kind: ConfigMap
metadata:
  name: vmselect-prometheus-nginx
  namespace: cattle-monitoring-system
data:
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stdout warn;
    pid /tmp/nginx.pid;
    events {
      worker_connections 1024;
    }
    http {
      access_log off;
      proxy_connect_timeout 10s;
      proxy_read_timeout 180s;
      proxy_send_timeout 10s;
      proxy_buffering off;
      server {
        listen 9090;
        listen [::]:9090;
        location /api/v1/ {
          proxy_set_header Accept-Encoding "";
          proxy_set_header Host $host;
          proxy_pass http://vmselect-vmks.monitoring.svc.cluster.local:8481/select/0/prometheus/api/v1/;
        }
        location / {
          proxy_set_header Accept-Encoding "";
          proxy_set_header Host $host;
          proxy_pass http://vmselect-vmks.monitoring.svc.cluster.local:8481/select/0/vmui/;
        }
      }
    }
