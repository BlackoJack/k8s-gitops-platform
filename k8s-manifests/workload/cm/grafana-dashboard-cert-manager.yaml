apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cert-manager
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: cert-manager
data:
  cert-manager.json: |
    {
      "uid": "cert-manager",
      "title": "cert-manager",
      "description": "Certificates / issuers / ACME. Namespace сертификата — exported_namespace (honorLabels=false).",
      "tags": [
        "platform",
        "cert-manager",
        "tls"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "1m",
      "editable": true,
      "graphTooltip": 1,
      "links": [
        {
          "asDropdown": false,
          "icon": "external",
          "targetBlank": true,
          "title": "Alertmanager",
          "type": "link",
          "url": "https://alertmanager.msk.corp.example"
        }
      ],
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "VictoriaMetrics Prometheus",
              "value": "VictoriaMetricsProm"
            },
            "hide": 0
          },
          {
            "name": "cluster",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(up{job=\"cert-manager\"}, cluster)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "namespace",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(certmanager_certificate_ready_status{cluster=~\"$cluster\"}, exported_namespace)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          },
          {
            "name": "cert",
            "label": "Certificate",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "${datasource}"
            },
            "query": "label_values(certmanager_certificate_ready_status{cluster=~\"$cluster\",exported_namespace=~\"$namespace\"}, name)",
            "refresh": 2,
            "includeAll": true,
            "allValue": ".*",
            "multi": true,
            "sort": 1,
            "current": {
              "text": "All",
              "value": "$__all"
            }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Controller",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min(up{job=\"cert-manager\",cluster=~\"$cluster\"}) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {
                      "text": "DOWN",
                      "color": "red"
                    },
                    "1": {
                      "text": "UP",
                      "color": "green"
                    }
                  }
                }
              ]
            }
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Certificates",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 4,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(count by (cluster, exported_namespace, name) (certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\",exported_namespace=~\"$namespace\",name=~\"$cert\"})) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Not Ready",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 8,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(certmanager_certificate_ready_status{cluster=~\"$cluster\",exported_namespace=~\"$namespace\",name=~\"$cert\",condition=\"False\"} == 1) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Min days left",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 12,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "min((certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\",exported_namespace=~\"$namespace\",name=~\"$cert\"} - time()) / 86400) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 14
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              },
              "unit": "d"
            }
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "ClusterIssuers Ready",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 16,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(certmanager_clusterissuer_ready_status{cluster=~\"$cluster\",condition=\"True\"} == 1) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 7,
          "type": "stat",
          "title": "Issuers Ready",
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 20,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "count(certmanager_issuer_ready_status{cluster=~\"$cluster\",condition=\"True\"} == 1) or vector(0)"
            }
          ],
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "justifyMode": "center",
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "values": false
            }
          },
          "fieldConfig": {
            "defaults": {
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "orange",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              }
            }
          }
        },
        {
          "id": 8,
          "type": "table",
          "title": "Certificates",
          "gridPos": {
            "h": 10,
            "w": 24,
            "x": 0,
            "y": 5
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "format": "table",
              "instant": true,
              "expr": "label_join((certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\",exported_namespace=~\"$namespace\",name=~\"$cert\"} - time()) / 86400, \"rowkey\", \"/\", \"cluster\", \"exported_namespace\", \"name\")"
            },
            {
              "refId": "B",
              "format": "table",
              "instant": true,
              "expr": "label_join(certmanager_certificate_ready_status{cluster=~\"$cluster\",exported_namespace=~\"$namespace\",name=~\"$cert\",condition=\"True\"}, \"rowkey\", \"/\", \"cluster\", \"exported_namespace\", \"name\")"
            }
          ],
          "options": {
            "showHeader": true,
            "cellHeight": "sm",
            "sortBy": [
              {
                "displayName": "days left",
                "desc": false
              }
            ]
          },
          "fieldConfig": {
            "defaults": {
              "custom": {
                "filterable": true,
                "align": "center"
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "days left"
                },
                "properties": [
                  {
                    "id": "decimals",
                    "value": 1
                  },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        {
                          "color": "red",
                          "value": null
                        },
                        {
                          "color": "orange",
                          "value": 14
                        },
                        {
                          "color": "green",
                          "value": 30
                        }
                      ]
                    }
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              },
              {
                "matcher": {
                  "id": "byName",
                  "options": "ready"
                },
                "properties": [
                  {
                    "id": "mappings",
                    "value": [
                      {
                        "type": "value",
                        "options": {
                          "0": {
                            "text": "False",
                            "color": "red"
                          },
                          "1": {
                            "text": "True",
                            "color": "green"
                          }
                        }
                      }
                    ]
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": {
                      "type": "color-background"
                    }
                  }
                ]
              }
            ]
          },
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "rowkey",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "Time 1": true,
                  "Time 2": true,
                  "__name__": true,
                  "__name__ 1": true,
                  "__name__ 2": true,
                  "container": true,
                  "endpoint": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "node": true,
                  "pod": true,
                  "prometheus": true,
                  "condition": true,
                  "issuer_kind": true,
                  "rowkey": true,
                  "cluster 2": true,
                  "exported_namespace 2": true,
                  "name 2": true,
                  "issuer_name 2": true
                },
                "renameByName": {
                  "exported_namespace": "cert ns",
                  "Value #A": "days left",
                  "Value #B": "ready",
                  "issuer_name": "issuer"
                },
                "indexByName": {
                  "cluster": 0,
                  "cert ns": 1,
                  "name": 2,
                  "issuer": 3,
                  "ready": 4,
                  "days left": 5
                }
              }
            }
          ]
        },
        {
          "id": 9,
          "type": "timeseries",
          "title": "Days until expiry",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 15
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "(certmanager_certificate_expiration_timestamp_seconds{cluster=~\"$cluster\",exported_namespace=~\"$namespace\",name=~\"$cert\"} - time()) / 86400",
              "legendFormat": "{{cluster}} {{exported_namespace}}/{{name}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "asc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "d",
              "decimals": 1,
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 2,
                "spanNulls": true
              },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 14
                  },
                  {
                    "color": "green",
                    "value": 30
                  }
                ]
              }
            }
          }
        },
        {
          "id": 10,
          "type": "row",
          "title": "ACME / controller",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 23
          }
        },
        {
          "id": 11,
          "type": "timeseries",
          "title": "ACME HTTP requests",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cluster, host, action, status) (rate(certmanager_http_acme_client_request_count{cluster=~\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} {{action}} {{status}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1,
                "spanNulls": true
              }
            }
          }
        },
        {
          "id": 12,
          "type": "timeseries",
          "title": "Controller sync errors",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 24
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cluster, controller) (rate(certmanager_controller_sync_error_count{cluster=~\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} {{controller}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 10,
                "lineWidth": 1,
                "spanNulls": true
              }
            }
          }
        },
        {
          "id": 13,
          "type": "timeseries",
          "title": "Controller sync calls",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 32
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (cluster, controller) (rate(certmanager_controller_sync_call_count{cluster=~\"$cluster\"}[$__rate_interval]))",
              "legendFormat": "{{cluster}} {{controller}}"
            }
          ],
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "right",
              "showLegend": true,
              "calcs": [
                "lastNotNull"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "custom": {
                "fillOpacity": 0,
                "lineWidth": 1,
                "spanNulls": true
              }
            }
          }
        }
      ]
    }
