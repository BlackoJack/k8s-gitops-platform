# VPA controllers only. Workloads opt in with a VerticalPodAutoscaler CR:
#
#   spec:
#     targetRef:
#       apiVersion: apps/v1
#       kind: Deployment
#       name: <workload>
#     updatePolicy:
#       updateMode: InPlaceOrRecreate
#
# InPlaceOrRecreate raises CPU/memory live (no restart) when kubelet can
# resize in place; falls back to eviction if the resize is infeasible
# (typical: memory downscale). Default/Auto/Recreate always restart.
# Do not VPA kube-system, Flux, or Rancher.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vpa
  namespace: kube-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: vpa
  chart:
    spec:
      chart: vpa
      version: "5.0.1"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: fairwinds
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    priorityClassName: platform-critical
    metrics-server:
      enabled: false
    recommender:
      extraArgs:
        v: "2"
        pod-recommendation-min-cpu-millicores: 15
        pod-recommendation-min-memory-mb: 100
      image:
        tag: "1.7.1"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 512Mi
      nodeSelector:
        environment: infra
      tolerations:
        - key: environment
          operator: Equal
          value: infra
          effect: PreferNoSchedule
    updater:
      extraArgs:
        v: "2"
        in-place-skip-disruption-budget: "true"
      image:
        tag: "1.7.1"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      nodeSelector:
        environment: infra
      tolerations:
        - key: environment
          operator: Equal
          value: infra
          effect: PreferNoSchedule
    admissionController:
      replicaCount: 2
      podDisruptionBudget:
        minAvailable: 1
      extraArgs:
        v: "2"
      image:
        tag: "1.7.1"
        pullPolicy: IfNotPresent
      generateCertificate: true
      registerWebhook: false
      mutatingWebhookConfiguration:
        failurePolicy: Ignore
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi
      nodeSelector:
        environment: infra
      tolerations:
        - key: environment
          operator: Equal
          value: infra
          effect: PreferNoSchedule
      certGen:
        image:
          tag: "v1.6.9"
          pullPolicy: IfNotPresent
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
        nodeSelector:
          environment: infra
        tolerations:
          - key: environment
            operator: Equal
            value: infra
            effect: PreferNoSchedule
