apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rke2-ingress-nginx
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: rke2-ingress-nginx
  maxHistory: 5
  chart:
    spec:
      chart: rke2-ingress-nginx
      version: "4.15.109"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: rke2-charts
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 5
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    global:
      clusterCIDR: 10.42.0.0/16
      clusterCIDRv4: 10.42.0.0/16
      clusterDNS: 10.43.0.10
      clusterDomain: cluster.local
      serviceCIDR: 10.43.0.0/16
    controller:
      kind: Deployment
      hostNetwork: false
      hostPort:
        enabled: false
      replicaCount: 2
      minAvailable: 1
      minReadySeconds: 10
      updateStrategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 0
          maxSurge: 1
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: rke2-ingress-nginx
              app.kubernetes.io/component: controller
      priorityClassName: platform-critical
      nodeSelector:
        environment: ingress
      tolerations:
        - key: environment
          operator: Equal
          value: ingress
          effect: NoSchedule
      autoscaling:
        enabled: true
        minReplicas: 2
        maxReplicas: 4
        targetCPUUtilizationPercentage: 80
        targetMemoryUtilizationPercentage: ""
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 512Mi
      ingressClassResource:
        name: nginx
        enabled: true
        default: false
        controllerValue: "k8s.io/ingress-nginx"
      extraArgs:
        default-ssl-certificate: "kube-system/msk-corp-wildcard"
      publishService:
        enabled: true
      config:
        allow-snippet-annotations: "true"
        use-forwarded-headers: "true"
        annotations-risk-level: Critical
        enable-metrics: "true"
      metrics:
        enabled: true
        serviceMonitor:
          enabled: false
      service:
        enabled: true
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        labels:
          io.cilium/lb-managed: "true"
        annotations:
          lbipam.cilium.io/ips: "10.16.0.202"
