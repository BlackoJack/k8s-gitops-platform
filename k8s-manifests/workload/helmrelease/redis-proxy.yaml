---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: redis-proxy
  namespace: redis-staging
spec:
  interval: 30m
  timeout: 10m
  dependsOn:
    - name: redis-app
      namespace: redis-staging
  chart:
    spec:
      chart: haproxy
      version: "1.30.1"
      sourceRef:
        kind: HelmRepository
        name: haproxytech
        namespace: flux-system
      interval: 1h
  install:
    createNamespace: true
  values:
    fullnameOverride: redis-app-proxy
    replicaCount: 2
    rbac:
      create: false
    serviceAccount:
      create: true
      automountServiceAccountToken: false
    containerPorts:
      redis: 6379
    extraEnvs:
      - name: REDIS_PASSWORD
        valueFrom:
          secretKeyRef:
            name: redis-auth
            key: password
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        memory: 64Mi
    # Image has user haproxy (uid 1000); listen is :6379 so no NET_BIND_SERVICE.
    # Chart only emits container SC when securityContext.enabled is true.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    extraVolumes:
      - name: run
        emptyDir: {}
    extraVolumeMounts:
      - name: run
        mountPath: /run
    livenessProbe:
      tcpSocket:
        port: redis
      periodSeconds: 10
    readinessProbe:
      tcpSocket:
        port: redis
      periodSeconds: 5
    PodDisruptionBudget:
      enable: true
      minAvailable: 1
    nodeSelector:
      environment: staging
    tolerations:
      - key: "environment"
        operator: "Equal"
        value: "staging"
        effect: "NoSchedule"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: redis-proxy
              topologyKey: kubernetes.io/hostname
    config: |
      global
        log stdout format raw local0
        maxconn 4096

      resolvers k8s
        parse-resolv-conf
        resolve_retries 3
        timeout resolve 1s
        timeout retry 1s
        hold valid 10s
        hold obsolete 30s
        accepted_payload_size 8192

      defaults
        mode tcp
        log global
        timeout connect 3s
        timeout client 1h
        timeout server 1h
        timeout check 2s

      listen redis
        bind *:6379
        mode tcp
        balance first
        option tcp-check
        option log-health-checks
        tcp-check connect
        tcp-check send "AUTH {{ print "${REDIS_PASSWORD}" }}\r\n"
        tcp-check expect string +OK
        tcp-check send "PING\r\n"
        tcp-check expect string +PONG
        tcp-check send "info replication\r\n"
        tcp-check expect string role:master
        tcp-check send "QUIT\r\n"
        tcp-check expect string +OK
        default-server inter 1s fall 3 rise 2 on-marked-down shutdown-sessions resolvers k8s resolve-prefer ipv4 init-addr last,libc,none
        server redis-0 redis-app-0.redis-app-headless.redis-staging.svc.cluster.local:6379 check
        server redis-1 redis-app-1.redis-app-headless.redis-staging.svc.cluster.local:6379 check
        server redis-2 redis-app-2.redis-app-headless.redis-staging.svc.cluster.local:6379 check
---
