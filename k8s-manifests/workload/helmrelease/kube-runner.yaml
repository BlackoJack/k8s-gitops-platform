apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-runner
  namespace: gitlab-ci
spec:
  interval: 5m
  chart:
    spec:
      chart: gitlab-runner
      version: '>=0.86.0'
      sourceRef:
        kind: HelmRepository
        name: gitlab
        namespace: flux-system
      interval: 1m
  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    image:
      tag: 'alpine-v19.5.0' # {"$imagepolicy": "flux-system:gitlab-runner:tag"}
    gitlabUrl: "https://gitlab.corp.example"
    rbac:
      create: true
      clusterWideAccess: true
    concurrent: 10
    checkInterval: 3
    metrics:
      enabled: true
      # Scrape is VMPodScrape monitoring/gitlab-runner (not chart PodMonitor).
      podMonitor:
        enabled: false
    resources:
      # Manager only (~40Mi RSS). CI job pods are unbounded — no LimitRange
      # in gitlab-ci and no cpu/memory in runners.kubernetes.
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi
    nodeSelector:
      environment: runners
    tolerations:
      - key: "environment"
        operator: "Equal"
        value: "runners"
        effect: "NoSchedule"
    runners:
      secret: kube-runner-secret
      cache:
        secretName: kube-runner-secret
      config: |-
        [[runners]]
          request_concurrency = 4

          [runners.kubernetes]
            image = "ubuntu:26.04"
            namespace = "gitlab-ci"
            service_account = "gitlab-ci-kubernetes-executor"
            allowed_pull_policies = ["always", "if-not-present", "never"]
            pull_policy = "if-not-present"
            node_tolerations_overwrite_allowed = ".*"

          [runners.kubernetes.dns_config]
            [[runners.kubernetes.dns_config.options]]
              name = "ndots"
              value = "2"

          [runners.cache]
            Type = "s3"
            Path = "runner"
            Shared = true
            [runners.cache.s3]
              ServerAddress = "minio.msk.corp.example"
              BucketName = "gitlab-cache"
              BucketLocation = "ru-msk-1"
              Insecure = false
              AuthenticationType = "access-key"

            [runners.kubernetes.node_selector]
              "environment" = "runners"

            [runners.kubernetes.node_tolerations]
              "environment=runners" = "NoSchedule"
