# Public hostnames terminate here. ClusterIP services stay open for
# vmagent, vlagent, Grafana datasources and the Rancher proxies.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: edge
  namespace: monitoring
spec:
  replicaCount: 2
  port: "8427"
  selectAllByDefault: false
  userSelector:
    matchLabels:
      vmks.corp.example/edge: "true"
  nodeSelector:
    environment: infra
  tolerations:
    - key: environment
      operator: Equal
      value: infra
      effect: PreferNoSchedule
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi
  securityContext:
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: vmauth
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
    - name: config-reloader
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
  initContainers:
    - name: config-init
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
