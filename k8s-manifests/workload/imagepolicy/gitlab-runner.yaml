apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: gitlab-runner
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: gitlab-runner
  filterTags:
    pattern: '^alpine-v(?P<version>[0-9]+\.[0-9]+\.[0-9]+)$'
    extract: '$version'
  policy:
    semver:
      range: '>=19.3.0'
