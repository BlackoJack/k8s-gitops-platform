apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: edge-reader
  namespace: monitoring
  labels:
    vmks.corp.example/edge: "true"
spec:
  username: ops
  passwordRef:
    name: vm-edge-auth
    key: reader-password
  targetRefs:
    - hosts:
        - 'vmui\.msk\.corp\.example'
      paths:
        - '/.*'
      headers:
        - "Host: vmui.msk.corp.example"
      crd:
        kind: VMCluster/vmselect
        name: vmks
        namespace: monitoring
    - hosts:
        - 'logs\.msk\.corp\.example'
      paths:
        - '/.*'
      headers:
        - "Host: logs.msk.corp.example"
      crd:
        kind: VLCluster/vlselect
        name: vmks
        namespace: monitoring
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: edge-metrics-writer
  namespace: monitoring
  labels:
    vmks.corp.example/edge: "true"
spec:
  tokenRef:
    name: vm-edge-auth
    key: metrics-writer-token
  targetRefs:
    - hosts:
        - 'vminsert\.msk\.corp\.example'
      paths:
        - '/insert/.*'
      crd:
        kind: VMCluster/vminsert
        name: vmks
        namespace: monitoring
---
