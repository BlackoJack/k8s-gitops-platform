apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-security
  namespace: flux-system
spec:
  interval: 10m
  timeout: 25m
  wait: true
  prune: true
  path: ./platform-security/kyverno
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kyverno
      namespace: kyverno
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-security-policies
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  wait: true
  prune: true
  path: ./platform-security/policies
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-security
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-security-reporter
  namespace: flux-system
spec:
  interval: 10m
  timeout: 10m
  wait: true
  prune: true
  path: ./platform-security/policy-reporter
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-security
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: policy-reporter
      namespace: kyverno
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: platform-security-monitoring
  namespace: flux-system
spec:
  interval: 10m
  timeout: 5m
  wait: true
  prune: true
  path: ./platform-security/monitoring
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: platform-security
    - name: platform-security-reporter
