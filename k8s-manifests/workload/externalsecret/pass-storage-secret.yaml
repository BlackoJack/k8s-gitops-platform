# Image pull secret for the pass-storage image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pass-storage-secret
  namespace: flux-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: pass-storage-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: ".dockerconfigjson"
      remoteRef:
        key: workload/flux-system/pass-storage-secret
        property: ".dockerconfigjson"
