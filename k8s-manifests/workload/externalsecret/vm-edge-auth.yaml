# vmagent and vmauth read writer tokens from this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vm-edge-auth
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: vm-edge-auth
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: logs-writer-token
      remoteRef:
        key: workload/monitoring/vm-edge-auth
        property: logs-writer-token
    - secretKey: metrics-writer-token
      remoteRef:
        key: workload/monitoring/vm-edge-auth
        property: metrics-writer-token
    - secretKey: reader-password
      remoteRef:
        key: workload/monitoring/vm-edge-auth
        property: reader-password
    - secretKey: reader-username
      remoteRef:
        key: workload/monitoring/vm-edge-auth
        property: reader-username
    - secretKey: traces-writer-token
      remoteRef:
        key: workload/monitoring/vm-edge-auth
        property: traces-writer-token
