# Grafana sidecar loads this datasource because of grafana_datasource=1.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasource-sentry
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: grafana-datasource-sentry
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          grafana_datasource: "1"
  data:
    - secretKey: "sentry.yaml"
      remoteRef:
        key: workload/monitoring/grafana-datasource-sentry
        property: "sentry.yaml"
