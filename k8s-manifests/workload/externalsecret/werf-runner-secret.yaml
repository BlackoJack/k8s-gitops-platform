# Flux watches this Secret so the runner HelmRelease rolls when the token changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: werf-runner-secret
  namespace: gitlab-ci
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: werf-runner-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: accesskey
      remoteRef:
        key: workload/gitlab-ci/werf-runner-secret
        property: accesskey
    - secretKey: runner-registration-token
      remoteRef:
        key: workload/gitlab-ci/werf-runner-secret
        property: runner-registration-token
    - secretKey: runner-token
      remoteRef:
        key: workload/gitlab-ci/werf-runner-secret
        property: runner-token
    - secretKey: secretkey
      remoteRef:
        key: workload/gitlab-ci/werf-runner-secret
        property: secretkey
