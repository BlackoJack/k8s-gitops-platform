# Sentry reads the external ClickHouse password from this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: external-clickhouse
  namespace: sentry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: external-clickhouse
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: username
      remoteRef:
        key: workload/sentry/external-clickhouse
        property: username
    - secretKey: password
      remoteRef:
        key: workload/sentry/external-clickhouse
        property: password
