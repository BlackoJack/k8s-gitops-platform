apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: technitium-api-token
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: technitium-api-token
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
  data:
    - secretKey: api-token
      remoteRef:
        key: workload/monitoring/technitium-api-token
        property: api-token
