# Sentry filestore reads the MinIO keys from this Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sentry-s3-secret
  namespace: sentry
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: sentry-s3-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          reconcile.fluxcd.io/watch: Enabled
  data:
    - secretKey: accessKey
      remoteRef:
        key: workload/sentry/sentry-s3-secret
        property: accessKey
    - secretKey: secretAccessKey
      remoteRef:
        key: workload/sentry/sentry-s3-secret
        property: secretAccessKey
