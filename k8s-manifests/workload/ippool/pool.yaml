apiVersion: "cilium.io/v2alpha1"
kind: CiliumLoadBalancerIPPool
metadata:
  name: ip-pool
  namespace: kube-system
spec:
  blocks:
    - start: "10.16.0.201"
      stop: "10.16.0.250"
---
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
  namespace: kube-system
spec:
  serviceSelector:
    matchLabels:
      io.cilium/lb-managed: "true"
  nodeSelector:
    matchLabels:
      environment: ingress
  interfaces:
    - "^eth[0-9]+"
    - "^ens[0-9]+"
  loadBalancerIPs: true
---
# API VIP must GARP from control-plane. The policy above only speaks
# from environment=ingress — if those nodes are gone, kubectl still
# needs :6443 on masters.
apiVersion: "cilium.io/v2alpha1"
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy-apiserver
  namespace: kube-system
spec:
  serviceSelector:
    matchLabels:
      corp.example/apiserver-vip: "true"
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
  interfaces:
    - "^eth[0-9]+"
    - "^ens[0-9]+"
  loadBalancerIPs: true
