apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: vlagent
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - monitoring
  selector:
    matchLabels:
      app.kubernetes.io/name: vlagent
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 30s
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
