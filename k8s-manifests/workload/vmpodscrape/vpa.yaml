apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: vpa
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - kube-system
  selector:
    matchLabels:
      app.kubernetes.io/name: vpa
  podMetricsEndpoints:
    - port: metrics
      path: /metrics
      interval: 30s
