apiVersion: v1
kind: Service
metadata:
  name: rke2-ingress-nginx-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: rke2-ingress-nginx
    app.kubernetes.io/component: controller
    monitoring.corp.example/scrape: "true"
spec:
  selector:
    app.kubernetes.io/name: rke2-ingress-nginx
    app.kubernetes.io/component: controller
  ports:
    - name: metrics
      port: 10254
      targetPort: 10254
      protocol: TCP
  type: ClusterIP
