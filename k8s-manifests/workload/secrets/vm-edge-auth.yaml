# Портфолио-копия: значения секретов вырезаны.
apiVersion: v1
kind: Secret
metadata:
  name: vm-edge-auth
  namespace: monitoring
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  # Browser login for VMUI and logs. Grafana and Alertmanager keep their own ingresses.
  reader-username: ops
  reader-password: "REDACTED"
  # Authorization: Bearer for remote write. In-cluster agents do not use these.
  metrics-writer-token: "REDACTED"
  logs-writer-token: "REDACTED"
  traces-writer-token: "REDACTED"
