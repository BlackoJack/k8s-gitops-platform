# Портфолио-копия: значения секретов вырезаны.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasource-gitlab
  namespace: monitoring
  labels:
    grafana_datasource: "1"
type: Opaque
stringData:
  # Sidecar подхватывает по лейблу grafana_datasource=1.
  # Token: GitLab → User Settings → Access Tokens (или Group → Access Tokens
  # на корневой группе). Name: grafana. Scopes: read_api. Role: Reporter.
  # В apiKeyValue кладётся токен read_api. Без токена дашборд GitLab pipelines пустой.
  gitlab.yaml: |
    apiVersion: 1
    datasources:
      - name: GitLab
        type: yesoreyeram-infinity-datasource
        access: proxy
        uid: gitlab-api
        editable: false
        jsonData:
          auth_method: apiKey
          apiKeyKey: PRIVATE-TOKEN
          apiKeyType: header
          allowedHosts:
            - https://gitlab.corp.example
          timeoutInSeconds: 60
          customHealthCheckEnabled: true
          customHealthCheckUrl: https://gitlab.corp.example/api/v4/user
        secureJsonData:
          apiKeyValue: REDACTED
