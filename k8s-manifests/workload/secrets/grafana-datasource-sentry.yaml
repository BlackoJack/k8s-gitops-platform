# Портфолио-копия: значения секретов вырезаны.
apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasource-sentry
  namespace: monitoring
  labels:
    grafana_datasource: "1"
type: Opaque
stringData:
  # Sidecar подхватывает по лейблу grafana_datasource=1.
  # Token: Sentry → Settings → Custom Integrations → Create New Integration
  # (Internal). Имя Grafana. Permissions Read: Organization, Project,
  # Issue & Event. Save → Tokens → New Token. Вставить в authToken.
  sentry.yaml: |
    apiVersion: 1
    datasources:
      - name: Sentry
        type: grafana-sentry-datasource
        access: proxy
        uid: sentry
        editable: false
        jsonData:
          url: http://sentry-web.sentry.svc.cluster.local:9000
          orgSlug: sentry
        secureJsonData:
          authToken: REDACTED
