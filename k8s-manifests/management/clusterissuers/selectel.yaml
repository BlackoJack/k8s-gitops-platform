apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selectel-issuer
spec:
  acme:
    email: platform@corp.example
    privateKeySecretRef:
      name: letsencrypt-production-account-key
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        webhook:
          config:
            apiKeySecretRef:
              name: selectel-api-key
              key: token
          groupName: acme.corp.selectel
          solverName: selectel
