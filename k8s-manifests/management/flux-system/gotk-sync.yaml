# Flux bootstrap генерирует этот файл. CRD и контроллеры
# (gotk-components.yaml) ставит `flux bootstrap`, в репозиторий они не входят.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 1m0s
  ref:
    branch: main
  secretRef:
    name: flux-system
  url: https://github.com/BlackoJack/k8s-gitops-platform.git
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-system
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./k8s-manifests/management
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
