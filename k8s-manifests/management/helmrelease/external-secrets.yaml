# Reads OpenBao KV mount `k8s` and materializes Kubernetes Secrets.
# Auth is the external-secrets ServiceAccount against mount kubernetes-management.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  interval: 10m
  timeout: 10m
  releaseName: external-secrets
  chart:
    spec:
      chart: external-secrets
      version: "2.13.0"
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: external-secrets
        namespace: flux-system
  install:
    createNamespace: true
    crds: Skip
    remediation:
      retries: 3
  upgrade:
    crds: Skip
    remediation:
      retries: 3
  values:
    installCRDs: true
    serviceAccount:
      create: false
      name: external-secrets
    replicaCount: 1
    nodeSelector:
      environment: root
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    livenessProbe:
      enabled: true
    readinessProbe:
      enabled: true
    webhook:
      nodeSelector:
        environment: root
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      livenessProbe:
        enabled: true
    certController:
      nodeSelector:
        environment: root
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      livenessProbe:
        enabled: true
