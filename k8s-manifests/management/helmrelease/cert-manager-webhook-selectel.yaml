---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager-webhook-selectel
  namespace: cert-manager
spec:
  chart:
    spec:
      chart: cert-manager-webhook-selectel
      version: 1.2.4
      sourceRef:
        kind: HelmRepository
        name: cert-manager-webhook-selectel
        namespace: flux-system
  interval: 3m0s
  values:
    groupName: acme.corp.selectel
    certManager:
      namespace: cert-manager
      serviceAccountName: cert-manager-cert-manager
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 64Mi