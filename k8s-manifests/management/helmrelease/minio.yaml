apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minio
  namespace: minio
spec:
  interval: 5m
  timeout: 30m
  releaseName: minio
  chart:
    spec:
      chart: minio
      version: ">=5.4.0"
      sourceRef:
        kind: HelmRepository
        name: minio
        namespace: flux-system

  install:
    createNamespace: true
    crds: CreateReplace
  upgrade:
    crds: CreateReplace

  values:
    mode: standalone

    persistence:
      enabled: true
      storageClass: ha-nfs
      size: 100Gi

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi

    existingSecret: minio-root
    # quay.io answers 401 for RELEASE.2024-12-18T13-15-44Z. The image is
    # already on this node; any other node fails the pull.
    nodeSelector:
      kubernetes.io/hostname: k8s-management-2
    # Chart default creates a console user via a post-upgrade Job that pulls
    # quay.io/minio/mc, which also returns 401. Empty list skips that Job.
    # The user from the original install stays.
    users: []

    ingress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: cilium
      hosts:
        - minio.msk.corp.example
      tls:
        - hosts:
            - minio.msk.corp.example

    consoleIngress:
      enabled: true
      annotations:
        kubernetes.io/ingress.class: cilium
      hosts:
        - minio-admin.msk.corp.example
      tls:
        - hosts:
            - minio-admin.msk.corp.example