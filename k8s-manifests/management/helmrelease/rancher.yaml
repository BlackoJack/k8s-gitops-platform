---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rancher
  namespace: cattle-system
spec:
  interval: 30m
  dependsOn:
    - name: cert-manager
      namespace: cert-manager
  chart:
    spec:
      chart: rancher
      version: ">=2.15.0"
      sourceRef:
        kind: HelmRepository
        name: rancher-stable
        namespace: flux-system
  targetNamespace: cattle-system
  install:
    createNamespace: true
  upgrade:
    crds: CreateReplace
  values:
    hostname: rancher.msk.corp.example
    replicas: 3
    # preferred игнорит anti-affinity: два Rancher садятся на одну 8Gi ноду
    # рядом с apiserver → NodeMemoryHighUtilization, потом crash.
    # required = 1 реплика на ноду. Rolling с maxSurge=1 (дефолт чарта)
    # четвёртый под Pending, пока не освободится нода.
    antiAffinity: required
    # WSS ~0.6–1.7Gi. Без request планировщик не видит память.
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 2Gi
    bootstrapPassword: REDACTED
    tls: ingress
    ingress:
      ingressClassName: cilium
      pathType: Prefix
      extraAnnotations:
        ingress.cilium.io/websocket: enabled
        # Envoy route timeout defaults to 15s if this field is omitted.
        # That kills Rancher shell / kubectl exec websockets before the prompt.
        ingress.cilium.io/request-timeout: "0s"
      tls:
        source: secret
        secretName: rancher-msk-corp
