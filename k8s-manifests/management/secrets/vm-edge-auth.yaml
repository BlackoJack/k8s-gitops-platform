# Портфолио-копия: значения секретов вырезаны.
apiVersion: v1
kind: Secret
metadata:
  name: vm-edge-auth
  namespace: monitoring
  labels:
    reconcile.fluxcd.io/watch: Enabled
type: Opaque
stringData:
  # Same tokens as workload/secrets/vm-edge-auth.yaml. vmagent sends metrics;
  # the logs token is here for when vlagent is enabled.
  metrics-writer-token: "REDACTED"
  logs-writer-token: "REDACTED"
