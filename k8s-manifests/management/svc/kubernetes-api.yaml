# External kube-apiserver VIP. Root is all control-plane, so the
# existing l2-policy (io.cilium/lb-managed, all nodes) is enough.
# DNS A is published from the workload cluster (dnsendpoint/k8s-management-api.yaml) —
# root has no external-dns.
#
# Serving cert does not include k8s-management.msk.corp.example yet.
# On each server, then rolling restart rke2-server (one node at a time):
#   /etc/rancher/rke2/config.yaml.d/99-tls-san.yaml
#     tls-san:
#       - k8s-management.msk.corp.example
#       - 10.16.0.183
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-api
  namespace: kube-system
  labels:
    io.cilium/lb-managed: "true"
  annotations:
    lbipam.cilium.io/ips: "10.16.0.183"
spec:
  type: LoadBalancer
  allocateLoadBalancerNodePorts: false
  externalTrafficPolicy: Local
  ports:
    - name: https
      port: 6443
      targetPort: 6443
      protocol: TCP
  selector:
    component: kube-apiserver
    tier: control-plane
